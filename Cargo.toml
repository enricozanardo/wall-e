[package]
name = "wall-e1"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.15.6", features = ["rayon", "serde"] }
ndarray-parallel = "0.9.1"
ndarray-rand = "0.14.0"
rand = "0.8.5"
rand_distr = "0.4.3"
rayon = "1.8.0"
regex = "1.9.3"
tempfile = "3.10.1"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.103"
csv = "1.3.0"
num_cpus = "1.16.0"
bincode = "1.3.3"
thiserror = "1.0.44"
memmap2 = "0.9.0"
byteorder = "1.4.3"
chrono = { version = "0.4.28", features = ["serde"] }
log = "0.4.19"
env_logger = "0.10.0"
clap = { version = "4.3.19", features = ["derive"] }
indicatif = "0.17.5"
url = "2.4.0"
bytemuck = "1.14.0"

[[bin]]
name = "batch_size_test"
path = "src/bin/batch_size_test.rs"

[[bin]]
name = "train_model_test"
path = "src/bin/train_model_test.rs"

[[example]]
name = "model_test"
path = "examples/model_test.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
